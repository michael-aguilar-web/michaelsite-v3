<style>
    /* ===== Gallery Modal ===== */
    #modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 50;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
    }

    #modal-overlay.open {
        opacity: 1;
        pointer-events: all;
    }

    #modal-card {
        background: #fff;
        border-radius: 14px;
        width: min(95vw, 1600px);
        height: 78vh;
        min-height: 380px;
        display: flex;
        position: relative;
        transform: translateY(100%);
        transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
        overflow: hidden;
    }

    #modal-overlay.open #modal-card {
        transform: translateY(0);
    }

    #modal-close {
        position: absolute;
        top: 10px;
        right: 12px;
        z-index: 20;
        background: rgba(255, 255, 255, 0.9);
        border: none;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #374151;
        transition: background 0.15s;
    }

    #modal-close:hover {
        background: #f3f4f6;
    }

    #modal-left {
        position: relative;
        width: 50%;
        background: #1a1a1a;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        flex-shrink: 0;
    }

    #modal-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: opacity 0.18s ease;
    }

    .modal-arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(255, 255, 255, 0.85);
        border: none;
        border-radius: 50%;
        width: 36px;
        height: 36px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 5;
        transition: background 0.15s;
        padding: 8px;
    }

    .modal-arrow:hover {
        background: #fff;
    }

    .modal-arrow img {
        width: 100%;
        height: 100%;
        display: block;
    }

    #modal-prev {
        left: 10px;
    }

    #modal-next {
        right: 10px;
    }

    #modal-dots {
        position: absolute;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        z-index: 5;
    }

    .modal-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.4);
        border: 1.5px solid rgba(255, 255, 255, 0.7);
        cursor: pointer;
        padding: 0;
        transition: background 0.15s, transform 0.15s;
    }

    .modal-dot.active {
        background: #fff;
        transform: scale(1.35);
    }

    #modal-right {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 24px 22px 20px;
        min-width: 0;
    }

    #modal-title {
        font-family: 'Outfit', sans-serif;
        font-size: 1.44rem;
        font-variation-settings: 'wght' 400;
        margin: 0 36px 14px 0;
        color: #111827;
    }

    #modal-tabs {
        display: flex;
        border-bottom: 1px solid #e5e7eb;
        margin-bottom: 14px;
        flex-shrink: 0;
    }

    .tab-btn {
        background: none;
        border: none;
        padding: 7px 14px;
        font-family: 'Poppins', sans-serif;
        font-size: 0.8rem;
        cursor: pointer;
        color: #9ca3af;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        transition: color 0.15s, border-color 0.15s;
    }

    .tab-btn:hover {
        color: #4b5563;
    }

    .tab-btn.active {
        color: #111827;
        border-bottom-color: #dc2626;
    }

    #modal-tab-content {
        flex: 1;
        overflow-y: auto;
        font-size: 1.09rem;
        line-height: 1.65;
        color: #4b5563;
    }

    .tab-links {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-top: 2px;
    }

    .tab-link-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #dc2626;
        text-decoration: none;
        font-size: 1rem;
        padding: 10px 14px;
        border: 1px solid #fca5a5;
        border-radius: 8px;
        transition: background 0.15s;
    }

    .tab-link-item::after {
        content: '↗';
        font-size: 0.875rem;
        opacity: 0.6;
        flex-shrink: 0;
        margin-left: 8px;
    }

    .tab-link-item:hover {
        background: #fef2f2;
        text-decoration: none;
    }

    /* ===== Gallery Grid ===== */
    .gallery-grid {
        display: grid;
        grid-template-columns: repeat(1, 1fr);
        gap: 1rem;
        padding: 1rem;
        width: 100%;
    }

    @media (min-width: 640px) {
        .gallery-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (min-width: 768px) {
        .gallery-grid {
            grid-template-columns: repeat(3, 1fr);
        }
    }

    @media (min-width: 1024px) {
        .gallery-grid {
            grid-template-columns: repeat(4, 1fr);
        }
    }

    /* ===== Project Cards ===== */
    .project-card {
        position: relative;
        overflow: hidden;
        border-radius: 10px;
        cursor: pointer;
        aspect-ratio: 1;
        background: #f3f4f6;
        transform: translateZ(0);
        will-change: transform;
    }

    .project-card>img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .project-card:hover>img {
        transform: scale(1.04);
    }

    /* ===== Mobile ===== */
    @media (max-width: 768px) {
        #modal-overlay {
            align-items: flex-end;
        }

        #modal-card {
            width: 100vw;
            max-width: 100vw;
            height: 100dvh;
            margin-bottom: 0;
            border-radius: 0;
            flex-direction: column;
        }

        #modal-left {
            width: 100%;
            height: 45%;
            border-radius: 0;
        }

        #modal-right {
            width: 100%;
            height: 55%;
            padding: 14px 16px 12px;
            overflow: hidden;
        }

        #modal-title {
            font-size: 1.25rem;
            margin-bottom: 10px;
        }
    }
</style>

    <script id='emanote-stork' data-emanote-base-url='/'>
      window.emanote = {};
      window.emanote.stork = {
        searchShown: false,
        indexIsStale: false,
        toggleSearch: function () {
          window.emanote.stork.refreshIndex();
          document.getElementById('stork-search-container').classList.toggle('hidden');
          window.emanote.stork.searchShown = document.body.classList.toggle('stork-overflow-hidden-important');
          if (window.emanote.stork.searchShown) {
            document.getElementById('stork-search-input').focus();
          }
        },
        clearSearch: function () {
          document.getElementById('stork-search-container').classList.add('hidden');
          document.body.classList.remove('stork-overflow-hidden-important');
          window.emanote.stork.searchShown = false;
        },

        getBaseUrl: function () {
          const baseUrl = document.getElementById("emanote-stork").getAttribute('data-emanote-base-url') || '/';
          return baseUrl;
        },

        registerIndex: function (options) {
          const indexName = 'emanote-search'; // used to match input[data-stork] attribute value
          const indexUrl = window.emanote.stork.getBaseUrl() + '-/stork.st';
          stork.register(
            indexName,
            indexUrl,
            options);
        },

        init: function () {
          if (document.readyState !== 'complete') {
            window.addEventListener('load', function () {
              stork.initialize(window.emanote.stork.getBaseUrl() + '_emanote-static/stork/stork.wasm');
              window.emanote.stork.registerIndex();
            });

            document.addEventListener('keydown', event => {
              if (window.emanote.stork.searchShown && event.key === 'Escape') {
                window.emanote.stork.clearSearch();
                event.preventDefault();
              } else if ((event.key == 'k' || event.key == 'K') && (event.ctrlKey || event.metaKey)) {
                window.emanote.stork.toggleSearch();
                event.preventDefault();
              }
            });
          } else {
            // This section is called during Ema's hot reload.
            // 
            // Mark the current index as stale, and refresh it *only when* the
            // user actually invokes search.
            // 
            // We do not refresh the index *right away*, as that will cause
            // memory leaks in the browser. See
            // https://github.com/srid/emanote/issues/411#issuecomment-1402056235
            console.log("stork: Marking index as stale");
            window.emanote.stork.markIndexAsStale();
          }
        },

        markIndexAsStale: function () {
          window.emanote.stork.indexIsStale = true;
        },

        refreshIndex: function () {
          if (window.emanote.stork.indexIsStale) {
            console.log("stork: Reloading index");
            window.emanote.stork.indexIsStale = false;
            // NOTE: This will leak memory. See the comment above.
            window.emanote.stork.registerIndex({ forceOverwrite: true });
          }
        }

      };

      window.emanote.stork.init();
