<style>
    /* ===== Gallery Modal ===== */
    #modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 50;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
    }

    #modal-overlay.open {
        opacity: 1;
        pointer-events: all;
    }

    #modal-card {
        background: #fff;
        border-radius: 14px;
        width: min(95vw, 1600px);
        height: 78vh;
        min-height: 380px;
        display: flex;
        position: relative;
        transform: translateY(100%);
        transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
        overflow: hidden;
    }

    #modal-overlay.open #modal-card {
        transform: translateY(0);
    }

    #modal-close {
        position: absolute;
        top: 10px;
        right: 12px;
        z-index: 20;
        background: rgba(255, 255, 255, 0.9);
        border: none;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #374151;
        transition: background 0.15s;
    }

    #modal-close:hover {
        background: #f3f4f6;
    }

    #modal-left {
        position: relative;
        width: 50%;
        background: #1a1a1a;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        flex-shrink: 0;
    }

    #modal-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: opacity 0.18s ease;
    }

    .modal-arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(255, 255, 255, 0.85);
        border: none;
        border-radius: 50%;
        width: 36px;
        height: 36px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 5;
        transition: background 0.15s;
        padding: 8px;
    }

    .modal-arrow:hover {
        background: #fff;
    }

    .modal-arrow img {
        width: 100%;
        height: 100%;
        display: block;
    }

    #modal-prev {
        left: 10px;
    }

    #modal-next {
        right: 10px;
    }

    #modal-dots {
        position: absolute;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        z-index: 5;
    }

    .modal-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.4);
        border: 1.5px solid rgba(255, 255, 255, 0.7);
        cursor: pointer;
        padding: 0;
        transition: background 0.15s, transform 0.15s;
    }

    .modal-dot.active {
        background: #fff;
        transform: scale(1.35);
    }

    #modal-right {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 24px 22px 20px;
        min-width: 0;
    }

    #modal-title {
        font-family: 'Outfit', sans-serif;
        font-size: 1.44rem;
        font-variation-settings: 'wght' 400;
        margin: 0 36px 14px 0;
        color: #111827;
    }

    #modal-tabs {
        display: flex;
        border-bottom: 1px solid #e5e7eb;
        margin-bottom: 14px;
        flex-shrink: 0;
    }

    .tab-btn {
        background: none;
        border: none;
        padding: 7px 14px;
        font-family: 'Poppins', sans-serif;
        font-size: 0.8rem;
        cursor: pointer;
        color: #9ca3af;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        transition: color 0.15s, border-color 0.15s;
    }

    .tab-btn:hover {
        color: #4b5563;
    }

    .tab-btn.active {
        color: #111827;
        border-bottom-color: #dc2626;
    }

    #modal-tab-content {
        flex: 1;
        overflow-y: auto;
        font-size: 1.09rem;
        line-height: 1.65;
        color: #4b5563;
    }

    .tab-links {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-top: 2px;
    }

    .tab-link-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #dc2626;
        text-decoration: none;
        font-size: 1rem;
        padding: 10px 14px;
        border: 1px solid #fca5a5;
        border-radius: 8px;
        transition: background 0.15s;
    }

    .tab-link-item::after {
        content: '↗';
        font-size: 0.875rem;
        opacity: 0.6;
        flex-shrink: 0;
        margin-left: 8px;
    }

    .tab-link-item:hover {
        background: #fef2f2;
        text-decoration: none;
    }

    /* ===== Gallery Grid ===== */
    .gallery-grid {
        display: grid;
        grid-template-columns: repeat(1, 1fr);
        gap: 1rem;
        padding: 1rem;
        width: 100%;
    }

    @media (min-width: 640px) {
        .gallery-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (min-width: 768px) {
        .gallery-grid {
            grid-template-columns: repeat(3, 1fr);
        }
    }

    @media (min-width: 1024px) {
        .gallery-grid {
            grid-template-columns: repeat(4, 1fr);
        }
    }

    /* ===== Project Cards ===== */
    .project-card {
        position: relative;
        overflow: hidden;
        border-radius: 10px;
        cursor: pointer;
        aspect-ratio: 1;
        background: #f3f4f6;
        transform: translateZ(0);
        will-change: transform;
    }

    .project-card>img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .project-card:hover>img {
        transform: scale(1.04);
    }

    /* ===== Mobile ===== */
    @media (max-width: 768px) {
        #modal-overlay {
            align-items: flex-end;
        }

        #modal-card {
            width: 100vw;
            max-width: 100vw;
            height: 100vh;
            margin-bottom: 0;
            border-radius: 0;
            flex-direction: column;
        }

        #modal-left {
            width: 100%;
            height: 45%;
            border-radius: 0;
        }

        #modal-right {
            width: 100%;
            height: 55%;
            padding: 14px 16px 12px;
        }

        #modal-title {
            font-size: 1.25rem;
            margin-bottom: 10px;
        }
    }
</style>

          return baseUrl;

        registerIndex: function (options) {
          const indexName = 'emanote-search'; // used to match input[data-stork] attribute value
          const indexUrl = window.emanote.stork.getBaseUrl() + '-/stork.st';
          stork.register(
            indexName,

        },

        init: function () {
          if (document.readyState !== 'complete') {

    <div id='cursor-label' class='cursor-label' aria-hidden='true'></div>
    <script>
      (function () {
        const label = document.getElementById('cursor-label');
        if (!label) return;
        // Target only the small icon buttons: anchors that wrap an <img> and have a title
        const iconImgs = document.querySelectorAll('a[data-label] > img');
        const buttons = Array.from(iconImgs).map(img => img.parentElement);
        let inside = false;

        function position(e) {
          label.style.left = (e.clientX + 12) + 'px';
          label.style.top = (e.clientY + 12) + 'px';
        }

        buttons.forEach(btn => {
          btn.addEventListener('mouseenter', (e) => {
            const t = btn.getAttribute('aria-label') || '';
            label.textContent = t;
            label.classList.add('show');
            position(e);
            inside = true;
          }, { passive: true });
          btn.addEventListener('mousemove', (e) => {
            if (!inside) return;
            position(e);
          }, { passive: true });
          btn.addEventListener('mouseleave', () => {
            inside = false;
            label.classList.remove('show');
          }, { passive: true });
          btn.addEventListener('click', () => {
            // Hide on click so it doesn't linger during navigation
            label.classList.remove('show');
          }, { passive: true });
        });
      })();
    </script>

    <!-- Secret wiki long-press handler -->
    <script>
      (function () {
        const avatar = document.getElementById('avatar-img');
        const secretRow = document.getElementById('secret-row');
        if (!avatar || !secretRow) return;

        const HOLD_MS = 800;
        let timer = null;
        let hideTimer = null;

        function hide() {
          secretRow.style.pointerEvents = 'none';
          secretRow.style.animation = 'secret-hide 400ms ease forwards';
        }

        function reveal() {
          secretRow.style.transition = '';
          secretRow.style.pointerEvents = 'auto';
          secretRow.style.animation = 'secret-pop 550ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards';
          clearTimeout(hideTimer);
          hideTimer = setTimeout(hide, 4000);
        }

        function cancel() { clearTimeout(timer); }

        avatar.addEventListener('touchstart', () => { timer = setTimeout(reveal, HOLD_MS); }, { passive: true });
        avatar.addEventListener('touchend', cancel, { passive: true });
        avatar.addEventListener('touchmove', cancel, { passive: true });

        avatar.addEventListener('mousedown', () => { timer = setTimeout(reveal, HOLD_MS); });
        avatar.addEventListener('mouseup', cancel);
        avatar.addEventListener('mouseleave', cancel);

        avatar.addEventListener('contextmenu', e => e.preventDefault());

        const wikiLink = secretRow.querySelector('a');
        if (wikiLink) {
          wikiLink.addEventListener('click', () => {
            clearTimeout(hideTimer);
            hide();
          });
        }
      })();
    </script>
